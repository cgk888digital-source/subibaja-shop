<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Fondo Terracota Oficial de Subibaja Adultos (#B94E3B) -->
  <circle cx="70" cy="70" r="70" fill="#B94E3B"/>
  
  <!-- Logotipo Subibaja en blanco -->
  <g style="mix-blend-mode: screen;">
    <image href="/logo-fino.png" x="8" y="8" width="124" height="124" style="filter: invert(1);"/>
  </g>
  
  <!-- Texto ADULTOS a lo largo de la diagonal idéntico al logo de Instagram -->
  <g transform="translate(24, 96) rotate(-38.5)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Poppins', sans-serif" font-size="6.8" font-weight="600" letter-spacing="3.2">ADULTOS</text>
  </g>
</svg>
